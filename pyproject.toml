[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blab-farm"
version = "0.1.3"
description = "Schedule Boundary Lab solves across several machines: one server address, many workers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Scholz"}]
keywords = ["boundary-lab", "acoustics", "BEM", "distributed"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blab-farm = "blab_farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blab_farm = ["dashboard.html"]
